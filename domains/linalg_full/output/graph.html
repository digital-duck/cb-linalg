<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Concept Graph — graph</title>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f0f2f5;overflow:hidden;height:100vh}
.app{
  display:grid;
  grid-template-columns:230px 1fr 210px;
  grid-template-rows:60vh 40vh;
  height:100vh;
  gap:0;
}
/* ── Left sidebar: learning path ── */
#path-sidebar{
  grid-column:1;grid-row:1/3;
  background:#f5f6f8;color:#2a2a2a;
  display:flex;flex-direction:column;
  overflow:hidden;
  border-right:1px solid #dde0e6;
}
#path-header{
  padding:14px 14px 10px;
  border-bottom:1px solid #dde0e6;
  flex-shrink:0;
}
#path-header h1{font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:#888;margin-bottom:2px;font-weight:700}
#path-header .domain-name{font-size:11px;color:#555;margin-top:4px}
#path-steps{flex:1;overflow-y:auto;padding:8px 0}
#path-steps .hint{color:#aaa;font-size:12px;text-align:center;padding:24px 12px;line-height:1.5}
.step-item{
  display:flex;align-items:flex-start;gap:8px;
  padding:7px 12px;cursor:pointer;
  border-left:3px solid transparent;
  transition:background .15s;
}
.step-item:hover{background:#ebebf0}
.step-item.active{background:#e8eef8;border-left-color:#4a90d9}
.step-item.target{background:#eaf5ea;border-left-color:#4caf50}
.step-num{min-width:20px;font-size:10px;font-weight:700;color:#bbb;padding-top:2px;flex-shrink:0}
.step-item.target .step-num{color:#4caf50}
.step-label{font-size:12px;font-weight:600;color:#333;line-height:1.4}
.step-def{font-size:10px;color:#888;margin-top:2px;line-height:1.4}
.step-kind{display:inline-block;padding:0 5px;border-radius:8px;font-size:9px;font-weight:700;margin-left:4px}
#path-count{font-size:10px;color:#aaa;margin-top:3px}
/* ── Graph panel ── */
#graph-panel{
  grid-column:2;grid-row:1;
  position:relative;background:#fff;
  border-bottom:2px solid #dde;
}
#graph-container{width:100%;height:100%}
.graph-recenter-btn{
  position:absolute;right:16px;bottom:16px;z-index:50;
  padding:6px 14px;border-radius:6px;
  border:1px solid #1e3a5f;background:#1e3a5f;color:#fff;
  font-size:12px;font-weight:600;font-family:system-ui,sans-serif;
  box-shadow:0 1px 4px rgba(0,0,0,.25);cursor:pointer;
}
.graph-recenter-btn:hover{background:#28496f;border-color:#28496f}
/* ── Explanation panel ── */
#explain-panel{
  grid-column:2;grid-row:2;
  background:#fff;overflow-y:auto;
  padding:16px 20px;
}
#explain-panel .empty{color:#aaa;font-size:13px;padding:20px 0;text-align:center}
#explain-panel .node-title{
  display:flex;align-items:center;gap:8px;margin-bottom:10px;
}
#explain-panel .node-title h2{font-size:16px;color:#1e3a5f}
.badge{
  display:inline-block;padding:2px 8px;border-radius:10px;
  font-size:11px;font-weight:700;
}
.badge.primitive{background:#e8f5e9;color:#2e7d32}
.badge.concept{background:#e3f2fd;color:#1565c0}
.badge.application{background:#fff3e0;color:#ef6c00}
.tier-tag{font-size:11px;color:#999;margin-left:auto}
#explain-panel .defines{
  font-size:14px;color:#333;line-height:1.6;margin-bottom:12px;
  padding:10px 12px;background:#f8f9fb;border-radius:6px;
  border-left:3px solid #90b4e8;
}
#explain-panel .section-label{
  font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:#999;margin-bottom:6px;
}
#explain-panel .prereq-list{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.prereq-chip{
  padding:3px 9px;border-radius:12px;font-size:11px;
  background:#e3f2fd;color:#1565c0;cursor:pointer;
  border:1px solid #90caf9;transition:background .12s;
}
.prereq-chip:hover{background:#bbdefb}
#explain-panel .meta-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.meta-item{font-size:12px;color:#555}
.meta-item b{color:#1e3a5f}
#explain-panel .play-hint{
  font-size:12px;color:#5a5a5a;line-height:1.6;
  padding:8px 12px;background:#fffde7;border-radius:6px;
  border-left:3px solid #ffd54f;margin-bottom:8px;
}
/* ── Notes sidebar ── */
#notes-sidebar{
  grid-column:3;grid-row:1/3;
  background:#fafaf8;
  border-left:2px solid #e8e8e0;
  display:flex;flex-direction:column;
  overflow:hidden;
}
#notes-header{
  padding:10px 12px 8px;
  border-bottom:1px solid #e0e0d8;
  flex-shrink:0;
}
#notes-header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
#notes-header h2{font-size:12px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.06em;margin:0}
#notes-node-label{font-size:11px;color:#999;margin-top:2px}
.nb-btn{font-size:10px;padding:2px 7px;border-radius:3px;
  border:1px solid #ddd;background:#f0f0ea;cursor:pointer;color:#777;
  font-family:system-ui,sans-serif}
.nb-btn:hover{background:#e0e0d8;color:#444}
#notes-textarea{
  flex:0 0 auto;height:100px;border:none;resize:none;
  padding:12px;font-size:12px;line-height:1.6;
  font-family:inherit;background:#fafaf8;color:#333;
  outline:none;
}
#notes-with-entries{
  border-top:1px solid #e8e8e0;flex:1;min-height:0;overflow-y:auto;
}
.note-entry{
  padding:6px 12px;cursor:pointer;
  border-bottom:1px solid #f0f0e8;
  font-size:11px;
}
.note-entry:hover{background:#f0efe8}
.note-entry .note-node{font-weight:600;color:#555;display:flex;justify-content:space-between;align-items:center}
.note-entry .note-ts{font-weight:400;color:#bbb;font-size:10px}
.note-entry .note-preview{color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ── kind badge colours in sidebar ── */
.primitive-k{background:#e8f5e9;color:#2e7d32}
.concept-k{background:#e3f2fd;color:#1565c0}
.application-k{background:#fff3e0;color:#ef6c00}
/* ── concept detail panel ── */
#concept-detail{margin-top:14px;border-top:1px solid #e8e8e0;padding-top:10px;}
#concept-iframe{width:100%;height:500px;border:1px solid #e0e0d8;border-radius:4px;margin-top:6px;display:block;}
.concept-not-found{color:#e57373;font-size:12px;padding:6px 0;font-style:italic;}
</style>
</head>
<body>
<div class="app">

<!-- LEFT: learning path sidebar -->
<aside id="path-sidebar">
  <div id="path-header">
    <h1>Learning Path</h1>
    <div class="domain-name">graph</div>
    <div id="path-count"></div>
  </div>
  <div id="path-steps">
    <div class="hint">Click any node in the graph<br>to see its learning path</div>
  </div>
</aside>

<!-- CENTRE TOP: concept graph -->
<div id="graph-panel">
  <div id="graph-container"></div>
  <button class="graph-recenter-btn" onclick="reCenterGraph()" title="Re-fit the graph to the viewport">Re-Center</button>
</div>

<!-- CENTRE BOTTOM: explanation panel -->
<div id="explain-panel">
  <div class="empty">Select a node to see its definition, prerequisites, and learning context.</div>
</div>

<!-- RIGHT: notes sidebar -->
<aside id="notes-sidebar">
  <div id="notes-header">
    <div id="notes-header-top">
      <h2>Notes</h2>
      <div>
        <button class="nb-btn" id="nb-clear-btn" onclick="clearNote()">Clear</button>
        <button class="nb-btn" onclick="exportNotes()">Export</button>
      </div>
    </div>
    <div id="notes-node-label">no node selected</div>
  </div>
  <textarea id="notes-textarea" placeholder="Type notes here&#10;(auto-saved per node)"></textarea>
  <div id="notes-with-entries"></div>
</aside>

</div><!-- .app -->

<script>
const RAW = {"nodes": [{"id": "column_vector", "label": "column vector", "kind": "primitive", "tier": 0, "defines": "An ordered list of m numbers written vertically, used to represent variables, constants, or solutions of a system.", "prereqs": [], "verifier": "", "lab": "", "play": "", "color": {"background": "#fffde7", "border": "#795548"}, "font": {"size": 13}}, {"id": "complex_conjugate_matrix", "label": "complex conjugate matrix", "kind": "primitive", "tier": 0, "defines": "The matrix formed by taking the complex conjugate of every entry of a matrix.", "prereqs": [], "verifier": "", "lab": "", "play": "", "color": {"background": "#fffde7", "border": "#795548"}, "font": {"size": 13}}, {"id": "complex_conjugate_vector", "label": "complex conjugate vector", "kind": "primitive", "tier": 0, "defines": "The vector formed by taking the complex conjugate of every entry of a vector.", "prereqs": [], "verifier": "", "lab": "", "play": "", "color": {"background": "#fffde7", "border": "#795548"}, "font": {"size": 13}}, {"id": "complex_number", "label": "complex number", "kind": "primitive", "tier": 0, "defines": "A number of the form a + bi used as the scalar field for vectors in this chapter.", "prereqs": [], "verifier": "", "lab": "", "play": "", "color": {"background": "#fffde7", "border": "#795548"}, "font": {"size": 13}}, {"id": "diagonal_matrix", "label": "diagonal matrix", "kind": "primitive", "tier": 0, "defines": "A square matrix whose entries off the main diagonal are all zero.", "prereqs": [], "verifier": "", "lab": "", "play": "", "color": {"background": "#fffde7", "border": "#795548"}, "font": {"size": 13}}, {"id": "eigenvalue_eigenvector_linear_transformation", "label": "eigenvalue eigenvector linear transformation", "kind": "primitive", "tier": 0, "defines": "For T:V to V, a nonzero vector v is an eigenvector with eigenvalue lambda if T(v) equals lambda times v.", "prereqs": [], "verifier": "", "lab": "", "play": "", "color": {"background": "#fffde7", "border": "#795548"}, "font": {"size": 13}}, {"id": "function", "label": "function", "kind": "primitive", "tier": 0, "defines": "A rule associating each element of a domain set with exactly one element of a codomain set.", "prereqs": [], "verifier": "", "lab": "", "play": "", "color": {"background": "#fffde7", "border": "#795548"}, "font": {"size": 13}}, {"id": "identity_linear_transformation", "label": "identity linear transformation", "kind": "primitive", "tier": 0, "defines": "The linear transformation on a vector space that maps every vector to itself.", "prereqs": [], "verifier": "", "lab": "", "play": "", "color": {"background": "#fffde7", "border": "#795548"}, "font": {"size": 13}}, {"id": "linear_equation", "label": "linear equation", "kind": "primitive", "tier": 0, "defines": "An equation involving only addition and multiplication of variables by constants (no products of variables, exponents, or transcendental functions), of the form a1x1 + a2x2 + ... = b.", "prereqs": [], "verifier": "", "lab": "", "play": "", "color": {"background": "#fffde7", "border": "#795548"}, "font": {"size": 13}}, {"id": "matrix", "label": "matrix", "kind": "primitive", "tier": 0, "defines": "A rectangular array of numbers with m rows and n columns, used to encode the coefficients and constants of a linear system.", "prereqs": [], "verifier": "", "lab": "", "play": "", "color": {"background": "#fffde7", "border": "#795548"}, "font": {"size": 13}}, {"id": "matrix_addition", "label": "matrix addition", "kind": "primitive", "tier": 0, "defines": "The sum of two matrices of the same size formed by adding corresponding entries.", "prereqs": [], "verifier": "", "lab": "", "play": "", "color": {"background": "#fffde7", "border": "#795548"}, "font": {"size": 13}}, {"id": "matrix_equality", "label": "matrix equality", "kind": "primitive", "tier": 0, "defines": "Two m x n matrices are equal when all their corresponding entries are equal.", "prereqs": [], "verifier": "", "lab": "", "play": "", "color": {"background": "#fffde7", "border": "#795548"}, "font": {"size": 13}}, {"id": "matrix_representation", "label": "matrix representation", "kind": "primitive", "tier": 0, "defines": "Given a linear transformation T, the m x n matrix whose columns are the vector representations of T applied to each basis vector.", "prereqs": [], "verifier": "", "lab": "", "play": "", "color": {"background": "#fffde7", "border": "#795548"}, "font": {"size": 13}}, {"id": "matrix_scalar_multiplication", "label": "matrix scalar multiplication", "kind": "primitive", "tier": 0, "defines": "The product of a scalar and a matrix formed by multiplying every entry of the matrix by the scalar.", "prereqs": [], "verifier": "", "lab": "", "play": "", "color": {"background": "#fffde7", "border": "#795548"}, "font": {"size": 13}}, {"id": "normal_matrix", "label": "normal matrix", "kind": "primitive", "tier": 0, "defines": "A square matrix A that commutes with its adjoint, satisfying A*A equals AA*.", "prereqs": [], "verifier": "", "lab": "", "play": "", "color": {"background": "#fffde7", "border": "#795548"}, "font": {"size": 13}}, {"id": "square_matrix", "label": "square matrix", "kind": "primitive", "tier": 0, "defines": "A matrix with an equal number of rows and columns, m = n.", "prereqs": [], "verifier": "", "lab": "", "play": "", "color": {"background": "#fffde7", "border": "#795548"}, "font": {"size": 13}}, {"id": "standard_unit_vectors", "label": "standard unit vectors", "kind": "primitive", "tier": 0, "defines": "The vectors e_j with a 1 in position j and 0 elsewhere, forming the columns of the identity matrix.", "prereqs": [], "verifier": "", "lab": "", "play": "", "color": {"background": "#fffde7", "border": "#795548"}, "font": {"size": 13}}, {"id": "submatrix", "label": "submatrix", "kind": "primitive", "tier": 0, "defines": "The matrix A(i|j) obtained from a matrix A by deleting row i and column j.", "prereqs": [], "verifier": "", "lab": "", "play": "", "color": {"background": "#fffde7", "border": "#795548"}, "font": {"size": 13}}, {"id": "transpose", "label": "transpose", "kind": "primitive", "tier": 0, "defines": "The matrix formed from a given matrix by swapping its rows and columns.", "prereqs": [], "verifier": "", "lab": "", "play": "", "color": {"background": "#fffde7", "border": "#795548"}, "font": {"size": 13}}, {"id": "triangular_matrix", "label": "triangular matrix", "kind": "primitive", "tier": 0, "defines": "A square matrix whose entries below (upper) or above (lower) the main diagonal are all zero.", "prereqs": [], "verifier": "", "lab": "", "play": "", "color": {"background": "#fffde7", "border": "#795548"}, "font": {"size": 13}}, {"id": "vector_space", "label": "vector space", "kind": "primitive", "tier": 0, "defines": "A set V with vector addition and scalar multiplication (over a field such as the complex numbers) satisfying ten defining properties (closure, commutativity, associativity, zero vector, additive inverses, and distributivity/scalar laws).", "prereqs": [], "verifier": "", "lab": "", "play": "", "color": {"background": "#fffde7", "border": "#795548"}, "font": {"size": 13}}, {"id": "zero_matrix", "label": "zero matrix", "kind": "primitive", "tier": 0, "defines": "The matrix with every entry equal to zero, serving as the additive identity for matrix addition.", "prereqs": [], "verifier": "", "lab": "", "play": "", "color": {"background": "#fffde7", "border": "#795548"}, "font": {"size": 13}}, {"id": "adjoint", "label": "adjoint", "kind": "concept", "tier": 1, "defines": "The matrix formed by conjugating a matrix and then transposing it (or vice versa), denoted A*.", "prereqs": ["transpose", "complex_conjugate_matrix"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "algebraic_multiplicity", "label": "algebraic multiplicity", "kind": "concept", "tier": 4, "defines": "The highest power of (x − λ) that divides the characteristic polynomial pA(x) for eigenvalue λ.", "prereqs": ["characteristic_polynomial"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "characteristic_polynomial", "label": "characteristic polynomial", "kind": "concept", "tier": 3, "defines": "For a square matrix A of size n, the polynomial pA(x) = det(A − xIn), whose roots are exactly the eigenvalues of A.", "prereqs": ["eigenvalue_eigenvector"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "augmented_matrix", "label": "augmented matrix", "kind": "concept", "tier": 3, "defines": "The matrix [A | b] formed by appending the vector of constants as an extra column to the coefficient matrix, representing a full system of equations.", "prereqs": ["coefficient_matrix", "vector_of_constants"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "coefficient_matrix", "label": "coefficient matrix", "kind": "concept", "tier": 2, "defines": "The matrix formed from the coefficients aij of a system of linear equations, with each row corresponding to one equation.", "prereqs": ["matrix", "system_of_linear_equations"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "vector_of_constants", "label": "vector of constants", "kind": "concept", "tier": 2, "defines": "The column vector formed from the right-hand-side constants bi of a system of linear equations.", "prereqs": ["column_vector", "system_of_linear_equations"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "bases_have_identical_sizes", "label": "bases have identical sizes", "kind": "concept", "tier": 6, "defines": "Any two finite bases of the same vector space contain the same number of vectors, which makes the notion of dimension well-defined.", "prereqs": ["basis"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "basis", "label": "basis", "kind": "concept", "tier": 5, "defines": "A subset of a vector space that is both linearly independent and spans the vector space, providing a minimal set of \"raw materials\" for building every vector uniquely.", "prereqs": ["linear_independence", "spanning_set"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "linear_independence", "label": "linear independence", "kind": "concept", "tier": 4, "defines": "A set of vectors for which the only relation of linear dependence is the trivial one.", "prereqs": ["relation_of_linear_dependence"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "spanning_set", "label": "spanning set", "kind": "concept", "tier": 4, "defines": "A subset S of a vector space V such that the span of S equals V.", "prereqs": ["span"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "basis_column_space", "label": "basis column space", "kind": "concept", "tier": 3, "defines": "A linearly independent spanning set for the column space obtained by taking the original columns of A corresponding to pivot columns of its reduced row-echelon form.", "prereqs": ["column_space"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "column_space", "label": "column space", "kind": "concept", "tier": 2, "defines": "The set of all linear combinations of the columns of a matrix, equal to the set of vectors b for which Ax = b is consistent.", "prereqs": ["matrix", "matrix_vector_product"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "basis_for_null_space", "label": "basis for null space", "kind": "concept", "tier": 6, "defines": "The spanning set for a null space is also linearly independent, forming a basis for the null space.", "prereqs": ["spanning_set_of_null_space", "linear_independence"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "spanning_set_of_null_space", "label": "spanning set of null space", "kind": "concept", "tier": 5, "defines": "A specific set of vectors, derived from free variables of a row-reduced matrix, whose span equals the null space of the matrix.", "prereqs": ["span", "vector_form_of_solutions"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "basis_row_space", "label": "basis row space", "kind": "concept", "tier": 4, "defines": "A linearly independent spanning set for the row space obtained from the nonzero rows of a row-equivalent reduced row-echelon form matrix.", "prereqs": ["row_space"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "row_space", "label": "row space", "kind": "concept", "tier": 3, "defines": "The column space of the transpose of a matrix, i.e. the set of all linear combinations of the matrix's rows.", "prereqs": ["column_space", "transpose"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "casting_out_vectors", "label": "casting out vectors", "kind": "concept", "tier": 6, "defines": "A procedure for removing redundant vectors from a spanning set, using pivot columns, to obtain a linearly independent set with the same span.", "prereqs": ["span", "dependency_in_linearly_dependent_sets"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "span", "label": "span", "kind": "concept", "tier": 3, "defines": "The set of all possible linear combinations of a given finite set of vectors.", "prereqs": ["linear_combination"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "dependency_in_linearly_dependent_sets", "label": "dependency in linearly dependent sets", "kind": "concept", "tier": 5, "defines": "A set of vectors is linearly dependent iff at least one vector can be written as a linear combination of the others.", "prereqs": ["linear_independence"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "change_of_basis_matrix", "label": "change of basis matrix", "kind": "concept", "tier": 1, "defines": "The matrix representation of the identity transformation on V relative to two bases B and C, used to convert vector representations between bases.", "prereqs": ["matrix_representation"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "eigenvalue_eigenvector", "label": "eigenvalue eigenvector", "kind": "concept", "tier": 2, "defines": "A nonzero vector x is an eigenvector of a square matrix A with eigenvalue λ if Ax = λx.", "prereqs": ["matrix_vector_product"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "characterization_finite_dim_vector_spaces", "label": "characterization finite dim vector spaces", "kind": "concept", "tier": 8, "defines": "Every finite-dimensional vector space of dimension n is isomorphic to C^n.", "prereqs": ["vector_representation_invertible"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "vector_representation_invertible", "label": "vector representation invertible", ound": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "computing_matrix_inverse", "label": "computing matrix inverse", "kind": "concept", "tier": 8, "defines": "A row-reduction procedure that augments a nonsingular matrix with the identity matrix and row-reduces to obtain the inverse.", "prereqs": ["matrix_inverse", "nonsingular_matrix"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "matrix_inverse", "label": "matrix inverse", "kind": "concept", "tier": 7, "defines": "For a square matrix A, a matrix B such that AB = BA = the identity matrix, written A^-1.", "prereqs": ["matrix_multiplication", "nonsingular_matrix"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "nonsingular_matrix", "label": "nonsingular matrix", "kind": "concept", "tier": 6, "defines": "A square matrix A for which the homogeneous system LS(A,0) has only the trivial solution; equivalently A row-reduces to the identity matrix, has trivial null space, and yields a unique solution to LS(A,b) for every constant vector b.", "prereqs": ["square_matrix", "homogeneous_system", "trivial_solution", "identity_matrix", "null_space"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "conjugate_eigenvalue_pairs", "label": "conjugate eigenvalue pairs", "kind": "concept", "tier": 3, "defines": "For a real matrix A, if x is an eigenvector for eigenvalue λ, then the conjugate vector x̄ is an eigenvector for the conjugate eigenvalue λ̄.", "prereqs": ["eigenvalue_eigenvector"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "consistent_system", "label": "consistent system", "kind": "concept", "tier": 6, "defines": "A system of linear equations that has at least one solution; a system is incon ", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "eigenvalues_eigenvectors_representations", "label": "eigenvalues eigenvectors representations", "kind": "concept", "tier": 8, "defines": "The eigenvalues and eigenvectors of T are intrinsic, independent of basis; eigenvectors of T correspond via rho_B to eigenvectors of any matrix representation.", "prereqs": ["eigenvalue_eigenvector_linear_transformation", "matrix_representation_and_similarity"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "matrix_representation_and_similarity", "label": "matrix representation and similarity", "kind": "concept", "tier": 7, "defines": "Two matrix representations of the same T relative to different bases are related by a similarity transformation using the change-of-basis matrix.", "prereqs": ["change_of_basis_matrix", "fundamental_theorem_matrix_representation"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "row_operations", "label": "row operations", "kind": "concept", "tier": 3, "defines": "Three operations on a matrix (swap two rows, multiply a row by a nonzero scalar, add a multiple of one row to another) analogous to equation operations, used to transform an augmented matrix.", "prereqs": ["matrix", "equation_operations"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "elementary_matrices_nonsingular", "label": "elementary matrices nonsingular", "kind": "concept", "tier": 7, "defines": "Every elementary matrix row-reduces to the identity matrix and is therefore nonsingular.", "prereqs": ["elementary_matrix", "nonsingular_matrix"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "entries_of_matrix_products", "label": "entries of matrix products", "kind": "concept", "tier": 3, "defines": "The formula expressing each entry of a matrix product AB as a sum of products of corresponding row and column entries of A and B.", "prereqs": ["matrix_multiplication"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "equal_dimensions_yields_equal_subspaces", "label": "equal dimensions yields equal subspaces", "kind": "concept", "tier": 8, "defines": "If a subspace U is contained in a subspace V and the two have the same (finite) dimension, then U and V must be the identical set.", "prereqs": ["dimension", "subspace"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "subspace", "label": "subspace", "kind": "concept", "tier": 1, "defines": "A subset of a vector space that is itself a vector space under the same operations; equivalently, a nonempty subset closed under vector addition and scalar multiplication (Theorem TSS).", "prereqs": ["vector_space"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "equation_operations", "label": "equation operations", "kind": "concept", "tier": 2, "defines": "Three operations (swap two equations, multiply an equation by a nonzero scalar, add a multiple of one equation to another) that transform a system without changing its solution set.", "prereqs": ["linear_equation", "system_of_linear_equations"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "equivalent_systems", "label": "equivalent systems", "kind": "concept", "tier": 3, "defines": "Two systems of linear equations are equivalent if they have identical solution sets.", "prereqs": ["system_of_linear_equations", "solution_set", "equation_operations"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "existence_of_eigenvalues", "label": "existence of eigenvalues", "kind": "concept", "tier": 3, "defines": "A theorem (with a determinant-free, constructive proof) establishing that every square matrix has at least one eigenvalue and associated eigenvector.", "prereqs": ["eigenvalue_eigenvector", "polynomial_of_matrix"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "extended_echelon_form", "label": "extended echelon form", "kind": "concept", "tier": 1, "defines": "The reduced row-echelon form of a matrix augmented on the right with an identity matrix, partitioned into submatrices B, J, C, K, and L.", "prereqs": ["matrix"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "four_subsets_theorem", "label": "four subsets theorem", "kind": "concept", "tier": 7, "defines": "The result that the null space, row space, column space, and left null space of a matrix can all be computed from the submatrices C and L of its extended echelon form.", "prereqs": ["extended_echelon_form", "null_space", "row_space", "column_space", "left_null_space"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "null_space", "label": "null space", "kind": "concept", "tier": 5, "defines": "The set N(A) of all solution vectors to the homogeneous system LS(A,0), viewed as a property of the coefficient matrix A.", "prereqs": ["homogeneous_system", "trivial_solution", "solution_set"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "left_null_space", "label": "left null space", "kind": "concept", "tier": 6, "defines": "The null space of the transpose of a matrix, consisting of vectors that produce a zero row combination of the matrix's rows.", "prereqs": ["null_space", "transpose"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "four_subspace_dimensions", "label": "four subspace dimensions", "kind": "concept", "tier": 10, "defines": "For an m×n matrix with rank r, the null space has dimension n−r, the column space and row space each have dimension r, and the left null space has dimension m−r.", "prereqs": ["rank_plus_nullity", "rank_of_transpose"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "rank_plus_nullity", "label": "rank plus nullity", "kind": "concept", "tier": 9, "defines": "For an m×n matrix A, the rank of A plus the nullity of A equals n, the number of columns.", "prereqs": ["rank", "nullity"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "rank_of_transpose", "label": "rank of transpose", "kind": "concept", "tier": 9, "defines": "For any matrix A, the rank of A equals the rank of its transpose, so the row space and column space always have the same dimension.", "prereqs": ["rank"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "free_dependent_variables", "label": "free dependent variables", "kind": "concept", "tier": 7, "defines": "In a consistent system's reduced row-echelon form, variables corresponding to pivot columns are dependent (determined by the others), while the remaining variables are free (may take any value), with n − r free variables total.", "prereqs": ["pivot_column", "consistent_system"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "fundamental_theorem_matrix_representation", "label": "fundamental theorem matrix representation", "kind": "concept", "tier": 6, "defines": "The action of T on u equals coordinatizing u, multiplying by the matrix representation of T, then un-coordinatizing the result.", "prereqs": ["matrix_representation", "vector_representation"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "vector_representation", "label": "vector representation", "kind": "concept", "tier": 5, "defines": "If a set is linearly independent and spans a vector space, every vector in the space can be written uniquely as a linear combination of that set's vectors.", "prereqs": ["linear_independence", "spanning_set"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "goldilocks_theorem", "label": "goldilocks theorem", "kind": "concept", "tier": 8, "defines": "In a vector space of dimension t, a set of vectors is linearly dependent if it has more than t vectors, fails to span if it has fewer than t vectors, and if it has exactly t vectors then linear independence and spanning each imply the other.", "prereqs": ["dimension", "linear_independence", "spanning_set"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "hermitian_matrix", "label": "hermitian matrix", "kind": "concept", "tier": 2, "defines": "A square matrix that equals its own adjoint.", "prereqs": ["adjoint"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "hermitian_matrix_eigenproperties", "label": "hermitian matrix eigenproperties", "kind": "concept", "tier": 3, "defines": "A Hermitian matrix has only real eigenvalues, and its eigenvectors for distinct eigenvalues are orthogonal.", "prereqs": ["eigenvalue_eigenvector"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "homogeneous_system", "label": "homogeneous system", "kind": "concept", "tier": 3, "defines": "A system of linear equations LS(A,0) in which every constant term is zero; such a system is always consistent since the trivial (all-zero) solution always works.", "prereqs": ["system_of_linear_equations", "vector_of_constants"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "reduced_row_echelon_form", "label": "reduced row echelon form", "kind": "concept", "tier": 4, "defines": "A canonical matrix form characterized by leading 1's (pivots) in a staircase pattern, each the only nonzero entry in its column, with zero rows at the bottom; every matrix has a unique row-equivalent matrix in this form, obtainable via Gauss-Jordan elimination.", "prereqs": ["matrix", "row_operations"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "linear_transformation", "label": "linear transformation", "kind": "concept", "tier": 2, "defines": "A function between vector spaces that preserves vector addition and scalar multiplication.", "prereqs": ["function", "vector_space", "matrix_vector_product"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "injective_transformations_and_dimension", "label": "injective transformations and dimension", "kind": "concept", "tier": 4, "defines": "If a linear transformation is injective, the dimension of its domain is less than or equal to the dimension of its codomain.", "prereqs": ["injective_linear_transformation"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "injective_transformations_and_linear_independence", "label": "injective transformations and linear independence", "kind": "concept", "tier": 4, "defines": "Injective linear transformations carry linearly "}, "font": {"size": 13}}, {"id": "kernel_is_subspace", "label": "kernel is subspace", "kind": "concept", "tier": 4, "defines": "The kernel of any linear transformation is always a subspace of the domain.", "prereqs": ["kernel_of_linear_transformation", "vector_space"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "kernel_null_space_isomorphism", "label": "kernel null space isomorphism", "kind": "concept", "tier": 8, "defines": "The kernel of T is isomorphic to the null space of its matrix representation, via vector representation restricted to the kernel.", "prereqs": ["fundamental_theorem_matrix_representation", "vector_representation_invertible"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "kernel_of_injective_transformation", "label": "kernel of injective transformation", "kind": "concept", "tier": 4, "defines": "A linear transformation is injective if and only if its kernel is trivial (contains only the zero vector).", "prereqs": ["kernel_of_linear_transformation", "injective_linear_transformation"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "linear_combination", "label": "linear combination", "kind": "concept", "tier": 2, "defines": "A vector formed by combining a set of vectors using scalar multiplication and vector addition.", "prereqs": ["vector_addition", "scalar_multiplication"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": 13}}, {"id": "vector_addition", "label": "vector addition", "kind": "concept", "tier": 1, "defines": "The sum of two vectors of the same size, formed by adding corresponding entries.", "prereqs": ["column_vector"], "verifier": "", "lab": "", "play": "", "color": {"background": "#e8f5e9", "border": "#2e7d32"}, "font": {"size": const DOMAIN_KEY = "graph";

// ── index ──────────────────────────────────────────────────────────────────
const nodeIndex = {};
RAW.nodes.forEach(n => nodeIndex[n.id] = n);

const prereqOf  = {};  // id → ids that are direct prerequisites OF id
const dependsOn = {};  // id → ids that id feeds into
RAW.nodes.forEach(n => { prereqOf[n.id] = []; dependsOn[n.id] = []; });
RAW.edges.forEach(e => {
  prereqOf[e.to].push(e.from);
  dependsOn[e.from].push(e.to);
});

// ── BFS longest-path levels (fixes application nodes at wrong tier) ─────────
const bfsLevels = (() => {
  const levels = {};
  const successors = {};
  RAW.nodes.forEach(n => { levels[n.id] = -1; successors[n.id] = []; });
  RAW.edges.forEach(e => successors[e.from].push(e.to));
  const sources = RAW.nodes.filter(n => !RAW.edges.some(e => e.to === n.id));
  const queue = sources.map(n => n.id);
  queue.forEach(n => levels[n] = 0);
  let i = 0;
  while (i < queue.length) {
    const cur = queue[i++];
    for (const succ of successors[cur]) {
      const nl = levels[cur] + 1;
      if (levels[succ] < nl) { levels[succ] = nl; queue.push(succ); }
    }
  }
  return levels;
})();

// ── graph algorithms ────────────────────────────────────────────────────────
function getAncestors(targetId) {
  const visited = new Set();
  const queue = [targetId];
  while (queue.length) {
    const cur = queue.shift();
    for (const p of prereqOf[cur])
      if (!visited.has(p)) { visited.add(p); queue.push(p); }
  }
  return visited;
}

function topoSort(nodeSet) {
  const inDeg = {};
  nodeSet.forEach(n => inDeg[n] = 0);
  nodeSet.forEach(n => { for (const p of prereqOf[n]) if (nodeSet.has(p)) inDeg[n]++; });
  const reach = {};
  nodeSet.forEach(n => {
    let r = 0;
    nodeSet.forEach(m => { if (m !== n && getAncestors(m).has(n)) r++; });
    reach[n] = r;
  });
  const heap = [];
  nodeSet.forEach(n => { if (inDeg[n] === 0) heap.push(n); });
  heap.sort((a, b) => (reach[b] - reach[a]) || a.localeCompare(b));
  const result = [];
  while (heap.length) {
    const node = heap.shift();
    result.push(node);
    for (const succ of dependsOn[node]) {
      if (!nodeSet.has(succ)) continue;
      if (--inDeg[succ] === 0) {
        heap.push(succ);
        heap.sort((a, b) => (reach[b] - reach[a]) || a.localeCompare(b));
      }
    }
  }
  return result;
}

// ── vis.js network ──────────────────────────────────────────────────────────
const container = document.getElementById('graph-container');
const visNodes = new vis.DataSet(RAW.nodes.map(n => ({
  id: n.id,
  label: n.label.replace(/ /g, '\n'),
  level: bfsLevels[n.id] !== undefined ? bfsLevels[n.id] : n.tier,
  color: n.color,
  font: n.font,
  title: `<b>${n.label}</b> [${n.kind}]<br>${n.defines || ''}`,
  shape: n.kind === 'concept' ? 'ellipse' : 'box',
})));
const visEdges = new vis.DataSet(RAW.edges.map((e, i) => ({
  id: i, from: e.from, to: e.to,
  arrows: 'to', color: {color: '#c8ccd4'}, width: 1,
})));
const network = new vis.Network(container, {nodes: visNodes, edges: visEdges}, {
  layout: { hierarchical: {
    enabled: true, direction: 'UD',
    sortMethod: 'directed', levelSeparation: 85, nodeSpacing: 130,
  } },
  physics: { enabled: false },
  interaction: { hover: true, tooltipDelay: 150 },
  edges: { smooth: { type: 'cubicBezier', forceDirection: 'vertical' } },
});

// Compact layout: group by tier, sort alphabetically, left-align all nodes.
network.once('afterDrawing', function() {
  const pos = network.getPositions();
  const spacing = 140;

  // Group nodes by their BFS tier
  const byTier = {};
  RAW.nodes.forEach(n => {
    const tier = bfsLevels[n.id] ?? n.tier ?? 0;
    if (!byTier[tier]) byTier[tier] = [];
    byTier[tier].push(n.id);
  });

  // Sort each tier alphabetically, assign X starting from 0
  const tiers = Object.keys(byTier).map(Number).sort((a, b) => a - b);
  const tierSep = 85;
  tiers.forEach((tier, ti) => {
    const ids = byTier[tier].sort();
    const y = ti * tierSep;
    ids.forEach((id, i) => {
      network.moveNode(id, i * spacing, y);
    });
  });

  network.fit({ animation: false });
});

function reCenterGraph() {
  network.fit({ animation: true });
}

const C_PATH   = {background: '#fff9c4', border: '#f9a825'};
const C_TARGET = {background: '#ffe082', border: '#e65100'};

function resetColors() {
  visNodes.update(RAW.nodes.map(n => ({id: n.id, color: n.color})));
  visEdges.update(RAW.edges.map((e, i) => ({id: i, color: {color: '#c8ccd4'}, width: 1})));
}

// ── explanation panel ───────────────────────────────────────────────────────
function renderExplanation(node) {
  const kclass = node.kind;
  const prereqChips = (node.prereqs || []).map(p =>
    `<span class="prereq-chip" onclick="selectNode('${p}')">${p.replace(/_/g,' ')}</span>`
  ).join('');
  const metaItems = [
    node.verifier ? `<span class="meta-item"><b>Verifier:</b> ${node.verifier}</span>` : '',
    node.lab      ? `<span class="meta-item"><b>Lab:</b> ${node.lab}</span>` : '',
  ].filter(Boolean).join('');
  const playHtml = node.play
    ? `<div class="section-label">Try it</div><div class="play-hint">${node.play}</div>`
    : '';

  const panel = document.getElementById('explain-panel');
  panel.innerHTML = `
    <div class="node-title">
      <h2>${node.label}</h2>
      <span class="badge ${kclass}">${kclass}</span>
      <span class="tier-tag">BFS level ${bfsLevels[node.id] ?? node.tier}</span>
    </div>
    ${node.defines ? `<div class="defines">${node.defines}</div>` : ''}
    ${prereqChips ? `<div class="section-label">Prerequisites</div><div class="prereq-list">${prereqChips}</div>` : ''}
    ${metaItems ? `<div class="meta-row">${metaItems}</div>` : ''}
    ${playHtml}
  `;

  // ── concept HTML detail ──
  const conceptsBase = window.__cb_CONCEPTS_BASE;
  const conceptUrls = window.__cb_CONCEPT_URLS || {};
  const mappedUrl = conceptUrls[node.id];
  if (mappedUrl || conceptsBase) {
    const conceptUrl = mappedUrl || (conceptsBase + 'concept_' + encodeURIComponent(node.id) + '.html');
    const detail = document.createElement('div');
    detail.id = 'concept-detail';
    detail.innerHTML = '<div class="section-label">Concept Detail</div><div class="concept-loading" style="color:#aaa;font-size:12px;padding:6px 0">Loading…</div>';
    panel.appendChild(detail);
    fetch(conceptUrl)
      .then(r => {
        if (!r.ok) throw new Error('not found');
        return r.text();
      })
      .then(html => {
        const slot = detail.querySelector('.concept-loading');
        if (!slot) return;
        // Vite dev server returns the SPA index.html (200) for missing static files.
        // Verify we got a real concept page by checking for a known marker.
        if (html.includes('spl-credit') || html.includes('Powered by')) {
          const iframe = document.createElement('iframe');
          iframe.id = 'concept-iframe';
          iframe.src = conceptUrl;
          slot.replaceWith(iframe);
        } else {
          slot.className = 'concept-not-found';
          slot.textContent = 'Content not found — generate it first.';
        }
      })
      .catch(() => {
        const slot = detail.querySelector('.concept-loading');
        if (slot) { slot.className = 'concept-not-found'; slot.textContent = 'Content not found — generate it first.'; }
      });
  }
}

// ── learning path sidebar ───────────────────────────────────────────────────
function renderPathSidebar(orderedPath, targetId) {
  const stepsEl = document.getElementById('path-steps');
  const countEl = document.getElementById('path-count');
  countEl.textContent = orderedPath.length
    ? `${orderedPath.length} step${orderedPath.length !== 1 ? 's' : ''} to learn first`
    : 'Root concept — no prerequisites';

  const target = nodeIndex[targetId];
  const kc = k => `${k.charAt(0).toUpperCase() + k.slice(1)}`;

  stepsEl.innerHTML = orderedPath.map((n, i) => {
    const nd = nodeIndex[n];
    return `<div class="step-item" onclick="selectNode('${n}')">
      <span class="step-num">${i + 1}.</span>
      <div>
        <div class="step-label">${nd.label}
          <span class="step-kind ${nd.kind}-k">${nd.kind}</span>
        </div>
        ${nd.defines ? `<div class="step-def">${nd.defines}</div>` : ''}
      </div>
    </div>`;
  }).join('') + `<div class="step-item target">
    <span class="step-num">▶</span>
    <div>
      <div class="step-label">${target.label}
        <span class="step-kind ${target.kind}-k">${target.kind}</span>
      </div>
      ${target.defines ? `<div class="step-def">${target.defines}</div>` : ''}
    </div>
  </div>`;
}

// ── notes (localStorage) ────────────────────────────────────────────────────
let currentNodeId = null;

function noteKey(nodeId) { return `concept_notes_${DOMAIN_KEY}_${nodeId}`; }

function loadNote(nodeId) {
  const parsed = _parseNote(localStorage.getItem(noteKey(nodeId)));
  return parsed ? parsed.text : '';
}

function saveNote(nodeId, text) {
  if (text.trim()) {
    const data = JSON.stringify({ text, ts: new Date().toISOString() });
    localStorage.setItem(noteKey(nodeId), data);
  } else {
    localStorage.removeItem(noteKey(nodeId));
  }
  renderNotesList();
}

function _parseNote(raw) {
  if (!raw) return null;
  try { const d = JSON.parse(raw); return { text: d.text || '', ts: d.ts || '' }; }
  catch (_) { return { text: raw, ts: '' }; }
}

function _fmtTs(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const yy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  const hh = String(d.getHours()).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  return `${yy}-${mm}-${dd} ${hh}:${mi}`;
}

function renderNotesList() {
  const container = document.getElementById('notes-with-entries');
  const entries = RAW.nodes
    .filter(n => localStorage.getItem(noteKey(n.id)))
    .map(n => {
      const parsed = _parseNote(localStorage.getItem(noteKey(n.id)));
      return {id: n.id, label: n.label, preview: (parsed?.text || '').slice(0, 60), ts: parsed?.ts || ''};
    });
  if (!entries.length) { container.innerHTML = ''; return; }
  container.innerHTML = entries.map(e =>
    `<div class="note-entry" onclick="selectNode('${e.id}')">
      <div class="note-node">${e.label}<span class="note-ts">${_fmtTs(e.ts)}</span></div>
      <div class="note-preview">${e.preview}</div>
    </div>`
  ).join('');
}

function switchNotes(nodeId) {
  if (currentNodeId !== null) {
    saveNote(currentNodeId, document.getElementById('notes-textarea').value);
  }
  currentNodeId = nodeId;
  document.getElementById('notes-textarea').value = loadNote(nodeId);
  document.getElementById('notes-node-label').textContent =
    nodeIndex[nodeId]?.label || nodeId;
}

function clearNote() {
  if (!currentNodeId) return;
  document.getElementById('notes-textarea').value = '';
  saveNote(currentNodeId, '');
  const btn = document.getElementById('nb-clear-btn');
  if (btn) { btn.textContent = 'Cleared!'; setTimeout(() => { btn.textContent = 'Clear'; }, 1000); }
}

function exportNotes() {
  const notes = {};
  RAW.nodes.forEach(n => {
    const v = localStorage.getItem(noteKey(n.id));
    if (v) notes[n.id] = v;
  });
  const blob = new Blob([JSON.stringify(notes, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${DOMAIN_KEY}_notes.json`;
  a.click();
}

document.getElementById('notes-textarea').addEventListener('input', () => {
  if (currentNodeId) saveNote(currentNodeId, document.getElementById('notes-textarea').value);
});

// ── unified node select ─────────────────────────────────────────────────────
function selectNode(nodeId) {
  if (!nodeIndex[nodeId]) return;
  network.selectNodes([nodeId]);
  handleSelect(nodeId);
}

function handleSelect(targetId) {
  const node = nodeIndex[targetId];

  renderExplanation(node);
  switchNotes(targetId);

  const ancestors = getAncestors(targetId);
  const pathSet = new Set([...ancestors]);
  const orderedPath = topoSort(pathSet);

  renderPathSidebar(orderedPath, targetId);

  resetColors();
  visNodes.update(orderedPath.map(n => ({id: n, color: C_PATH})));
  visNodes.update([{id: targetId, color: C_TARGET}]);
  visEdges.update(RAW.edges.map((e, i) => {
    const inPath = pathSet.has(e.from) && (pathSet.has(e.to) || e.to === targetId);
    return {id: i, color: {color: inPath ? '#f9a825' : '#c8ccd4'}, width: inPath ? 2 : 1};
  }));
}

network.on('click', params => {
  if (params.nodes.length) handleSelect(params.nodes[0]);
});

// initialise notes list on load
renderNotesList();

// When viewed directly (not in an iframe), inject a back link next to the
// "Learning Path" heading so it doesn't look like a title-bar element.
if (window.parent === window) {
  var h1 = document.querySelector('#path-header h1');
  if (h1) {
    var backLink = document.createElement('a');
    backLink.href = '../../';
    backLink.textContent = '← App';
    backLink.style.cssText = [
      'font-size:10px','color:#2563eb','font-family:system-ui,sans-serif',
      'text-decoration:none','font-weight:400','letter-spacing:normal',
      'text-transform:none','white-space:nowrap','flex-shrink:0'
    ].join(';');
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:baseline;gap:8px;';
    h1.parentNode.insertBefore(row, h1);
    row.appendChild(h1);
    row.appendChild(backLink);
  }
}
