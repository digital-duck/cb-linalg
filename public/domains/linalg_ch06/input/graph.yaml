domain: linalg_beezer_ch06
primitives:
  matrix_vector_product:
    defines: The operation Ax that transforms a vector x into another vector by multiplying with a square
      matrix A, treated as a function converting one vector to another.
    tier: 0
  diagonal_matrix:
    defines: A square matrix whose entries off the main diagonal are all zero.
    tier: 0
concepts:
  eigenvalue_eigenvector:
    defines: A nonzero vector x is an eigenvector of a square matrix A with eigenvalue λ if Ax = λx.
    composed_of:
    - matrix_vector_product
    tier: 1
  polynomial_of_matrix:
    defines: Evaluating a polynomial p(x) by substituting a square matrix A for the variable, using matrix
      powers, scalar multiplication, and addition in place of the usual operations.
    composed_of:
    - matrix_vector_product
    tier: 1
  similar_matrices:
    defines: Two square matrices A and B of the same size are similar if there exists a nonsingular matrix
      S such that A = S⁻¹BS.
    composed_of:
    - matrix_vector_product
    tier: 1
  existence_of_eigenvalues:
    defines: A theorem (with a determinant-free, constructive proof) establishing that every square matrix
      has at least one eigenvalue and associated eigenvector.
    composed_of:
    - eigenvalue_eigenvector
    - polynomial_of_matrix
    tier: 2
  characteristic_polynomial:
    defines: For a square matrix A of size n, the polynomial pA(x) = det(A − xIn), whose roots are exactly
      the eigenvalues of A.
    composed_of:
    - eigenvalue_eigenvector
    tier: 2
  eigenspace:
    defines: For an eigenvalue λ of A, the set of all eigenvectors of A for λ together with the zero vector,
      shown to form a subspace equal to the null space of A − λIn.
    composed_of:
    - eigenvalue_eigenvector
    tier: 2
  eigenvectors_distinct_eigenvalues_independent:
    defines: A set of eigenvectors of A corresponding to pairwise distinct eigenvalues is always linearly
      independent.
    composed_of:
    - eigenvalue_eigenvector
    tier: 2
  eigenvalue_singularity_link:
    defines: A square matrix A is singular if and only if λ = 0 is an eigenvalue of A, extending the nonsingular
      matrix equivalences list.
    composed_of:
    - eigenvalue_eigenvector
    tier: 2
  eigenvalue_transformations:
    defines: Rules describing how eigenvalues change under scalar multiples, powers, polynomials, inverses,
      and transposes of a matrix.
    composed_of:
    - eigenvalue_eigenvector
    - polynomial_of_matrix
    tier: 2
  conjugate_eigenvalue_pairs:
    defines: For a real matrix A, if x is an eigenvector for eigenvalue λ, then the conjugate vector x̄
      is an eigenvector for the conjugate eigenvalue λ̄.
    composed_of:
    - eigenvalue_eigenvector
    tier: 2
  hermitian_matrix_eigenproperties:
    defines: A Hermitian matrix has only real eigenvalues, and its eigenvectors for distinct eigenvalues
      are orthogonal.
    composed_of:
    - eigenvalue_eigenvector
    tier: 2
  similarity_equivalence_relation:
    defines: The similarity relation between matrices is reflexive, symmetric, and transitive.
    composed_of:
    - similar_matrices
    tier: 2
  diagonalizable_matrix:
    defines: A square matrix A is diagonalizable if it is similar to a diagonal matrix.
    composed_of:
    - similar_matrices
    - diagonal_matrix
    tier: 2
  algebraic_multiplicity:
    defines: The highest power of (x − λ) that divides the characteristic polynomial pA(x) for eigenvalue
      λ.
    composed_of:
    - characteristic_polynomial
    tier: 3
  geometric_multiplicity:
    defines: The dimension of the eigenspace EA(λ) for eigenvalue λ of matrix A.
    composed_of:
    - eigenspace
    tier: 3
  degree_of_characteristic_polynomial:
    defines: The characteristic polynomial of an n×n matrix always has degree exactly n.
    composed_of:
    - characteristic_polynomial
    tier: 3
  similar_matrices_equal_eigenvalues:
    defines: Similar matrices share the same characteristic polynomial, and hence the same eigenvalues
      with the same algebraic multiplicities (though the converse is false).
    composed_of:
    - similar_matrices
    - characteristic_polynomial
    tier: 3
  diagonalization_characterization:
    defines: A matrix of size n is diagonalizable if and only if there exists a linearly independent set
      of n eigenvectors of the matrix, which then form the columns of the similarity matrix.
    composed_of:
    - diagonalizable_matrix
    - eigenvalue_eigenvector
    tier: 3
  multiplicity_bounds:
    defines: For any eigenvalue λ, 1 ≤ geometric multiplicity ≤ algebraic multiplicity ≤ n, the algebraic
      multiplicities of all distinct eigenvalues sum to n, and a matrix of size n has at most n distinct
      eigenvalues.
    composed_of:
    - algebraic_multiplicity
    - geometric_multiplicity
    tier: 4
  diagonalizable_full_eigenspaces:
    defines: A matrix is diagonalizable if and only if the geometric multiplicity equals the algebraic
      multiplicity for every eigenvalue.
    composed_of:
    - diagonalizable_matrix
    - algebraic_multiplicity
    - geometric_multiplicity
    tier: 4
  distinct_eigenvalues_diagonalizable:
    defines: A square matrix of size n with n distinct eigenvalues is necessarily diagonalizable.
    composed_of:
    - diagonalization_characterization
    - eigenvectors_distinct_eigenvalues_independent
    tier: 4
applications:
  matrix_power_via_diagonalization:
    defines: Using A = SDS⁻¹ to compute high powers of a diagonalizable matrix efficiently as A^k = SD^kS⁻¹,
      since powers of a diagonal matrix are simple.
    needs:
    - diagonalizable_matrix
    - diagonalization_characterization
    - diagonal_matrix
    tier: 4
  fibonacci_closed_form:
    defines: Using eigenvalues, eigenvectors, and diagonalization of the Fibonacci recurrence matrix to
      derive a closed-form expression (Binet's formula) for terms of the Fibonacci sequence.
    needs:
    - matrix_power_via_diagonalization
    - eigenvalue_eigenvector
    - diagonalization_characterization
    tier: 5
